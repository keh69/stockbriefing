<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 브리핑 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --line: #e4e7ec; --accent: #2f6bff; --accent-text: #ffffff;
    --chip: #eef2ff; --err-bg: #fdecec; --err: #b42318; --soft: #f8f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa1ac;
      --line: #2a2f38; --accent: #5b8cff; --accent-text: #0b0d12;
      --chip: #1f2635; --err-bg: #3a1716; --err: #ffb4ab; --soft: #1d2027;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  details > summary { cursor: pointer; font-weight: 600; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  #keyState { font-weight: 500; font-size: 13px; margin-left: 6px; }
  #keyState.ok { color: #12a150; } #keyState.no { color: var(--err); }
  label { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }
  label input, label select { display: block; width: 100%; margin-top: 4px; }
  input, select {
    font: inherit; color: var(--text); background: var(--soft);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
    padding: 10px 16px; background: var(--accent); color: var(--accent-text);
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: progress; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .row a { color: var(--accent); font-size: 14px; text-decoration: none; margin-left: auto; }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; font-size: 17px; padding: 14px 16px; background: var(--card); }
  .search button { padding: 0 22px; font-size: 16px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
  .chips button { background: var(--chip); color: var(--text); font-weight: 500; font-size: 13px; padding: 4px 12px; border-radius: 999px; }
  .status { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; background: var(--chip); }
  .status.err { background: var(--err-bg); color: var(--err); white-space: pre-wrap; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: r .8s linear infinite; vertical-align: -1px; margin-right: 8px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
  .result-head button { padding: 6px 14px; font-size: 13px; }
  .out { font-size: 16px; }
  .out .stock { font-size: 20px; font-weight: 700; margin: 0 0 18px; }
  .out h3 { font-size: 15px; margin: 18px 0 6px; }
  .out ul { margin: 0; padding-left: 0; list-style: none; }
  .out li { padding-left: 1.1em; text-indent: -1.1em; margin: 2px 0; }
  .out li::before { content: "* "; color: var(--muted); }
  .brief { background: var(--soft); border-radius: 10px; padding: 14px 16px; }
  .brief p { margin: 0 0 4px; }
  .brief .first { font-weight: 700; margin-bottom: 12px; }
  .sources { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .sources summary { font-weight: 500; }
  .sources ol { margin: 8px 0 0; padding-left: 20px; }
  .sources a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 10px; }
  @media (max-width: 480px) {
    .wrap { padding-top: 20px; }
    .search { flex-direction: column; }
    .search button { padding: 12px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>종목 브리핑 생성기</h1>
  <p class="sub">종목명을 넣으면 Gemini가 최신 뉴스를 검색해 테마 · 이슈 · 브리핑으로 정리합니다.</p>

  <details id="settings" class="card">
    <summary>⚙️ Gemini 설정<span id="keyState"></span></summary>
    <label>API 키
      <input id="apiKey" type="password" placeholder="AIza로 시작하는 키" autocomplete="off" spellcheck="false">
    </label>
    <div class="row">
      <button id="saveKey" type="button">저장</button>
      <button id="clearKey" type="button" class="ghost">지우기</button>
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료 키 발급 →</a>
    </div>
    <label>모델
      <select id="model"></select>
    </label>
    <div class="row">
      <button id="loadModels" type="button" class="ghost">모델 목록 새로고침</button>
    </div>
    <p class="hint">키는 폴더의 <code>.env.local</code>(깃 제외) 또는 이 브라우저(localStorage)에만 저장됩니다. 화면에서 저장한 키가 있으면 그것을 먼저 씁니다.</p>
  </details>

  <form id="form" class="search" autocomplete="off">
    <input id="stock" placeholder="종목명 (예: 큐알티)" required>
    <button id="go" type="submit">브리핑 생성</button>
  </form>
  <div id="recent" class="chips"></div>
  <div id="status" class="status" hidden></div>

  <section id="result" class="card" hidden>
    <div class="result-head">
      <span id="resultMeta"></span>
      <button id="copy" type="button" class="ghost">전체 복사</button>
    </div>
    <div id="out" class="out"></div>
    <details id="srcBox" class="sources" hidden>
      <summary>참고한 뉴스 출처 (<span id="srcCount">0</span>)</summary>
      <ol id="sources"></ol>
    </details>
  </section>
</main>

<!-- 로컬 전용 키 파일 (.gitignore 로 커밋 제외). 없으면 조용히 넘어가고, 화면에서 키를 입력하면 된다. -->
<script src=".env.local" onerror="void 0"></script>
<script>
(() => {
  'use strict';

  const API = 'https://generativelanguage.googleapis.com/v1beta';
  const FALLBACK_MODEL = 'gemini-flash-latest'; // 모델 목록을 못 불러왔을 때만 쓰는 별칭
  const $ = (s) => document.querySelector(s);

  // ---------- 저장소 (사생활 모드 등에서 실패해도 동작하도록) ----------
  const store = {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  // .env.local 의 GEMINI_API_KEY="..." 한 줄이 스크립트로 읽히면 전역 변수가 된다.
  const ENV_KEY = (typeof window.GEMINI_API_KEY === 'string' ? window.GEMINI_API_KEY : '').trim();
  // 화면에서 직접 저장한 키가 있으면 그것을 먼저 쓰고, 없으면 .env.local 키를 쓴다.
  const getKey = () => (store.get('gemini_key', '') || '').trim() || ENV_KEY;

  // ---------- 설정 패널 ----------
  function refreshKeyState() {
    const saved = (store.get('gemini_key', '') || '').trim();
    const has = !!getKey();
    const el = $('#keyState');
    el.textContent = saved ? '· 키 저장됨' : ENV_KEY ? '· .env.local 키 사용 중' : '· 키 필요';
    el.className = has ? 'ok' : 'no';
    if (!has) $('#settings').open = true;
  }

  function setModelOptions(names, selected) {
    const sel = $('#model');
    sel.innerHTML = '';
    for (const n of names) {
      const o = document.createElement('option');
      o.value = o.textContent = n;
      sel.appendChild(o);
    }
    sel.value = names.includes(selected) ? selected : names[0];
  }

  function versionOf(name) {
    const m = name.match(/^gemini-(\d+(?:\.\d+)?)/);
    return m ? parseFloat(m[1]) : 0;
  }

  // 무료로 쓰기 좋은 Flash 계열만 추리고, 최신 정식 버전을 기본으로 고른다.
  async function loadModels(quiet) {
    const key = getKey();
    if (!key) { if (!quiet) showStatus('먼저 API 키를 저장해 주세요.', 'err'); return; }
    try {
      const res = await fetch(`${API}/models?pageSize=200`, { headers: { 'x-goog-api-key': key } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(explainError(res.status, data));
      const names = (data.models || [])
        .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map((m) => m.name.replace(/^models\//, ''))
        .filter((n) => /^gemini-/.test(n) && /flash/.test(n))
        .filter((n) => !/(image|tts|audio|live|embedding|exp|computer)/.test(n));
      if (!names.length) throw new Error('사용할 수 있는 Flash 모델을 찾지 못했습니다.');
      const stable = names.filter((n) => /^gemini-\d+(\.\d+)?-flash$/.test(n))
        .sort((a, b) => versionOf(b) - versionOf(a));
      const rest = names.filter((n) => !stable.includes(n)).sort((a, b) => versionOf(b) - versionOf(a));
      const ordered = [...stable, ...rest];
      const saved = store.get('gemini_model_user');
      setModelOptions(ordered, saved && ordered.includes(saved) ? saved : ordered[0]);
      if (!quiet) showStatus(`모델 ${ordered.length}개를 불러왔습니다. 기본: ${$('#model').value}`);
    } catch (e) {
      if (!quiet) showStatus('모델 목록을 불러오지 못했습니다.\n' + e.message, 'err');
    }
  }

  $('#saveKey').addEventListener('click', () => {
    const v = $('#apiKey').value.trim();
    if (!v) { showStatus('API 키를 입력해 주세요.', 'err'); return; }
    store.set('gemini_key', v);
    $('#apiKey').value = '';
    $('#apiKey').placeholder = '저장됨 (바꾸려면 새 키 입력)';
    refreshKeyState();
    showStatus('키를 저장했습니다. 모델 목록을 불러오는 중…', 'load');
    loadModels(false);
  });
  $('#clearKey').addEventListener('click', () => {
    store.del('gemini_key');
    $('#apiKey').placeholder = 'AIza로 시작하는 키';
    refreshKeyState();
    showStatus('저장된 키를 지웠습니다.');
  });
  $('#loadModels').addEventListener('click', () => loadModels(false));
  // 사용자가 직접 고른 모델만 기억한다. (자동 선택은 저장하지 않아 항상 최신 모델을 따라간다)
  $('#model').addEventListener('change', (e) => store.set('gemini_model_user', e.target.value));

  // ---------- 상태 표시 ----------
  let timer = null;
  function showStatus(msg, kind) {
    const el = $('#status');
    clearInterval(timer);
    el.hidden = !msg;
    el.className = 'status' + (kind === 'err' ? ' err' : '');
    if (kind === 'load') {
      const t0 = Date.now();
      const draw = () => {
        el.innerHTML = '<span class="spin"></span>';
        el.append(`${msg} (${Math.round((Date.now() - t0) / 1000)}초)`);
      };
      draw();
      timer = setInterval(draw, 1000);
    } else {
      el.textContent = msg || '';
    }
  }

  function explainError(status, data) {
    const raw = (data && data.error && data.error.message) || '';
    let msg;
    if (/API key not valid|API_KEY_INVALID/i.test(raw)) msg = 'API 키가 올바르지 않습니다. 설정에서 키를 다시 확인해 주세요.';
    else if (status === 429) msg = '사용 한도에 걸렸습니다. 1분쯤 뒤에 다시 해 보세요.\n계속 같은 오류가 나면 이 키의 무료 등급에 Google 검색 기능 한도가 없는 것입니다. (AI Studio에서 결제를 연결해야 검색이 열립니다)';
    else if (status === 404) msg = '이 모델을 쓸 수 없습니다. 설정에서 "모델 목록 새로고침" 후 다른 모델을 골라 주세요.';
    else if (status === 403) msg = '이 키로는 권한이 없습니다. 키 발급 화면에서 Gemini API가 켜져 있는지 확인해 주세요.';
    else if (status >= 500) msg = 'Gemini 서버가 혼잡합니다. 잠시 뒤 다시 시도해 주세요.';
    else msg = `요청이 실패했습니다 (코드 ${status}).`;
    return raw ? `${msg}\n(원문: ${raw})` : msg;
  }

  // ---------- Gemini 호출 ----------
  async function callGemini(body) {
    const key = getKey();
    const model = $('#model').value || FALLBACK_MODEL;
    const res = await fetch(`${API}/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(explainError(res.status, data));
    const cand = (data.candidates || [])[0];
    if (!cand) {
      const why = data.promptFeedback && data.promptFeedback.blockReason;
      throw new Error('응답이 비어 있습니다.' + (why ? ` (차단 사유: ${why})` : ''));
    }
    const text = ((cand.content && cand.content.parts) || [])
      .filter((p) => p.text && !p.thought).map((p) => p.text).join('');
    return { text, cand, model };
  }

  function todayKR() {
    const d = new Date();
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;
  }

  // CLAUDE.md 의 "출력 양식"과 반드시 같은 내용으로 유지한다.
  function buildPrompt(name) {
    return `오늘은 ${todayKR()}입니다. 너는 한국 주식 방송에서 종목 이야기를 쉽게 풀어주는 애널리스트다.

Google 검색을 여러 번 해서 한국 상장 종목 「${name}」에 대해 아래를 찾아라.
- 이 종목이 국내 증시에서 묶이는 테마
- 최근 뉴스(가능하면 최근 2주 이내, 오래된 것보다 최신 우선): 실적, 수주, 공시, 신사업
- 이 종목과 관련된 최근 시장·업황 뉴스(미국 증시, 수출 통계, 섹터 흐름 등)와 구체적인 숫자

그다음 아래 JSON 하나만 출력해라. 앞뒤 설명, 마크다운, 코드블록 없이 JSON만.

{
  "stock": "정식 종목명",
  "code": "6자리 종목코드(모르면 빈 문자열)",
  "themes": ["테마", "..."],
  "issues": ["이슈", "..."],
  "briefing": ["문장", "..."]
}

[themes]
- 3~6개. 증권가·뉴스에서 흔히 쓰는 테마 이름 그대로. 약어는 괄호로 풀어쓴다. 예: "HBM(고대역폭메모리)"

[issues]
- 최근 주가에 영향을 준 이슈 2~4개. 짧은 뉴스 헤드라인체, 명사형 끝맺음(~지속, ~상승, ~기대감).
- 순서: 시장·업황 → 섹터 흐름 → 종목 고유 이슈.

[briefing]
- 6~9개 원소. 원소 하나가 한 줄이며, 한 줄에 짧은 문장 1~2개.
- "📌 ... 이야기 잠깐 하겠습니다" 첫 줄은 쓰지 마라. 프로그램이 붙인다.
- 방송에서 말하듯 쉬운 구어체 "~습니다/~입니다".
- 흐름: ① 시장·업황 소식(구체적 숫자) → ② 국내 관련 데이터나 섹터 흐름 → ③ 이 회사가 무엇을 하는 회사인지 쉽게 한 줄 → ④ 테마와 이어지는 사업 포인트 1~2줄 → ⑤ 최근 실적·수주·공시 숫자 → ⑥ 마지막 줄은 전체를 한 줄로 묶는 정리.
- 전문용어는 바로 쉬운 말로 풀어준다. 숫자는 검색으로 확인된 것만 쓰고 절대 지어내지 않는다.
- 매수·매도 추천, 목표주가, 수익 보장 표현은 쓰지 않는다.

[예시 — 문체와 구성을 이렇게 맞춘다]
{
  "stock": "큐알티",
  "code": "405100",
  "themes": ["시스템반도체", "전력반도체", "온디바이스AI", "HBM(고대역폭메모리)"],
  "issues": [
    "AI 인프라 성장 둔화 우려 완화되며 반도체 수출 호조세 지속",
    "반도체관련주 상승",
    "HBM - 유리기판 분석 수요로 성장 기대감"
  ],
  "briefing": [
    "어젯밤 미국 반도체지수가 5.7%나 올랐습니다. AI 투자가 꺾인다는 걱정이 좀 풀린 겁니다.",
    "우리나라도 11월 초 열흘 동안 반도체 수출이 331% 늘었습니다. 같은 기간으로는 역대 최대입니다.",
    "큐알티는 반도체를 만드는 회사가 아니라, 제대로 만들어졌는지 '검증'해 주는 회사입니다.",
    "HBM은 칩을 층층이 쌓아서 붙입니다. 그래서 붙인 부분을 꼼꼼히 확인하는 일이 점점 많아집니다.",
    "유리기판도 이제 양산 검증 단계라서, 분석해 달라는 의뢰가 늘고 있습니다.",
    "마침 오늘 3분기 실적이 나왔는데, 누적 영업이익이 59억으로 작년보다 55% 늘었습니다.",
    "이익률도 7%에서 10%로 올라, 돈 되는 일감이 많아지고 있다는 게 숫자로 보입니다.",
    "업황, 신사업, 실적이 지금 한 방향을 보고 있는 겁니다."
  ]
}
(예시의 숫자는 참고용이다. 「${name}」에 대해서는 반드시 새로 검색한 사실만 쓴다.)

한국 상장 종목을 찾을 수 없으면 {"error": "이유"} 만 출력해라.`;
  }

  function extractJSON(text) {
    let t = (text || '').replace(/```(?:json)?/gi, '').trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) throw new Error('JSON 없음');
    return JSON.parse(t.slice(a, b + 1));
  }

  // 검색 결과 글이 JSON 모양이 아닐 때, 검색 없이 한 번 더 불러 JSON으로만 옮긴다.
  async function repairJSON(rawText) {
    const { text } = await callGemini({
      contents: [{ role: 'user', parts: [{ text:
        '아래 글의 내용을 바꾸지 말고 {"stock","code","themes":[],"issues":[],"briefing":[]} 형식의 JSON으로만 옮겨라. ' +
        'briefing 은 한 줄씩 배열 원소로, "📌 ... 이야기 잠깐 하겠습니다" 줄은 빼라.\n\n' + rawText }] }],
      generationConfig: { responseMimeType: 'application/json' },
    });
    return extractJSON(text);
  }

  const cleanLine = (s) => String(s || '')
    .replace(/^\s*(?:[*\-•·]|\d+[.)])\s*/, '')
    .replace(/\[\d+(?:,\s*\d+)*\]/g, '')   // [1], [2,3] 같은 인용 표시 제거
    .replace(/\s+/g, ' ').trim();

  function toList(v) {
    if (Array.isArray(v)) return v;
    if (typeof v === 'string') return v.split(/\n|,(?![^()]*\))/);
    return [];
  }

  function normalize(obj, fallbackName) {
    const stock = cleanLine(obj.stock) || fallbackName;
    const uniq = (arr) => [...new Set(arr.map(cleanLine).filter(Boolean))];
    const themes = uniq(toList(obj.themes));
    const issues = uniq(Array.isArray(obj.issues) ? obj.issues : String(obj.issues || '').split('\n'));
    let briefing = (Array.isArray(obj.briefing) ? obj.briefing : String(obj.briefing || '').split('\n'))
      .map(cleanLine).filter(Boolean)
      .filter((l) => !/이야기\s*잠깐\s*하겠습니다/.test(l));
    return { stock, code: cleanLine(obj.code), themes, issues, briefing };
  }

  // ---------- 화면 그리기 ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  let current = null;

  function render(r, sources, model) {
    const out = $('#out');
    out.innerHTML = '';
    out.append(el('p', 'stock', `종목 : ${r.stock}`));

    out.append(el('h3', null, '테마'));
    const tu = el('ul'); tu.append(el('li', null, r.themes.join(', ') || '(확인된 테마 없음)'));
    out.append(tu);

    out.append(el('h3', null, '이슈'));
    const iu = el('ul');
    (r.issues.length ? r.issues : ['(최근 이슈를 찾지 못했습니다)']).forEach((t) => iu.append(el('li', null, t)));
    out.append(iu);

    out.append(el('h3', null, '브리핑 :'));
    const bx = el('div', 'brief');
    bx.append(el('p', 'first', `📌 ${r.stock} 이야기 잠깐 하겠습니다`));
    r.briefing.forEach((t) => bx.append(el('p', null, t)));
    out.append(bx);

    const now = new Date();
    $('#resultMeta').textContent =
      `${r.code ? r.code + ' · ' : ''}${todayKR()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} · ${model}`;

    const ol = $('#sources'); ol.innerHTML = '';
    sources.forEach((s) => {
      const li = el('li');
      const a = el('a', null, s.title || s.uri);
      a.href = s.uri; a.target = '_blank'; a.rel = 'noopener noreferrer';
      li.append(a); ol.append(li);
    });
    $('#srcCount').textContent = sources.length;
    $('#srcBox').hidden = !sources.length;

    $('#result').hidden = false;
    current = r;
  }

  // 복사용 텍스트 — CLAUDE.md 출력 양식 그대로
  function toText(r) {
    return [
      `종목 : ${r.stock}`, '',
      '테마', `* ${r.themes.join(', ')}`, '',
      '이슈', ...r.issues.map((t) => `* ${t}`), '',
      '브리핑 :', `📌 ${r.stock} 이야기 잠깐 하겠습니다`, '',
      ...r.briefing,
    ].join('\n');
  }

  $('#copy').addEventListener('click', async () => {
    if (!current) return;
    const text = toText(current);
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = el('textarea'); ta.value = text; document.body.append(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    const b = $('#copy'); b.textContent = '복사됨 ✓';
    setTimeout(() => { b.textContent = '전체 복사'; }, 1500);
  });

  // ---------- 최근 검색 ----------
  function getRecent() { try { return JSON.parse(store.get('recent', '[]')) || []; } catch { return []; } }
  function pushRecent(name) {
    const list = [name, ...getRecent().filter((n) => n !== name)].slice(0, 8);
    store.set('recent', JSON.stringify(list));
    drawRecent();
  }
  function drawRecent() {
    const box = $('#recent'); box.innerHTML = '';
    getRecent().forEach((n) => {
      const b = el('button', null, n); b.type = 'button';
      b.addEventListener('click', () => { $('#stock').value = n; run(n); });
      box.append(b);
    });
  }

  // ---------- 실행 ----------
  let busy = false;
  async function run(name) {
    name = (name || '').trim();
    if (!name || busy) return;
    if (!getKey()) {
      $('#settings').open = true;
      showStatus('먼저 Gemini API 키를 저장해 주세요. (설정 → 무료 키 발급)', 'err');
      return;
    }
    busy = true; $('#go').disabled = true;
    showStatus(`「${name}」 뉴스를 검색하고 브리핑을 쓰는 중…`, 'load');
    try {
      const { text, cand, model } = await callGemini({
        contents: [{ role: 'user', parts: [{ text: buildPrompt(name) }] }],
        tools: [{ google_search: {} }],
      });
      let obj;
      try { obj = extractJSON(text); }
      catch {
        if (!text) throw new Error('모델이 빈 답을 보냈습니다. 다시 시도해 주세요.');
        showStatus('결과를 양식에 맞추는 중…', 'load');
        obj = await repairJSON(text);
      }
      if (obj.error) throw new Error(`종목을 찾지 못했습니다: ${obj.error}`);

      const r = normalize(obj, name);
      if (!r.briefing.length) throw new Error('브리핑이 비어 있습니다. 다시 시도해 주세요.');

      const chunks = (cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || [];
      const seen = new Set();
      const sources = chunks.map((c) => c.web).filter((w) => w && w.uri && !seen.has(w.uri) && seen.add(w.uri));

      render(r, sources, model);
      pushRecent(r.stock);
      showStatus('');
    } catch (e) {
      showStatus(e.message || String(e), 'err');
    } finally {
      busy = false; $('#go').disabled = false;
    }
  }

  $('#form').addEventListener('submit', (e) => { e.preventDefault(); run($('#stock').value); });

  // ---------- 시작 ----------
  store.del('gemini_model'); // 예전 버전이 자동 저장한 값 정리
  const savedModel = store.get('gemini_model_user') || FALLBACK_MODEL;
  setModelOptions([savedModel], savedModel);
  refreshKeyState();
  if (getKey()) { $('#apiKey').placeholder = '설정됨 (바꾸려면 새 키 입력)'; loadModels(true); }
  drawRecent();
  $('#stock').focus();

  // 개발 확인용 (콘솔에서 결과 화면을 미리 볼 때)
  window.__briefing = { render, toText, normalize };
})();
</script>
</body>
